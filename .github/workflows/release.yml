name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.decide.outputs.should_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP '(?<=<Version>).*(?=</Version>)' Directory.Build.props)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if needed
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Decide if release is needed
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif ! gh release view "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [ x64, x86 ]
    defaults:
      run:
        working-directory: ./PoproshaykaBot.Wpf

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish framework-dependent
        run: >
          dotnet publish PoproshaykaBot.Wpf.csproj
          --configuration Release
          --runtime win-${{ matrix.arch }}
          --output .\publish\framework-dependent
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:UpdatableBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --no-self-contained

      - name: Publish portable
        run: >
          dotnet publish PoproshaykaBot.Wpf.csproj
          --configuration Release
          --runtime win-${{ matrix.arch }}
          --output .\publish\portable
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PortableMode=true
          -p:UpdatableBuild=true
          -p:Version=${{ needs.prepare.outputs.version }}
          --self-contained

      - name: Package artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.prepare.outputs.version }}"
          $arch = "${{ matrix.arch }}"
          New-Item -ItemType Directory -Path ".\artifacts" -Force | Out-Null
          Rename-Item -Path ".\publish\framework-dependent\PoproshaykaBot.Wpf.exe" -NewName "PoproshaykaBot-v$version-$arch.exe"
          Rename-Item -Path ".\publish\portable\PoproshaykaBot.Wpf.exe" -NewName "PoproshaykaBot-v$version-$arch-portable.exe"
          Move-Item -Path ".\publish\framework-dependent\PoproshaykaBot-v$version-$arch.exe" -Destination ".\artifacts\"
          Move-Item -Path ".\publish\portable\PoproshaykaBot-v$version-$arch-portable.exe" -Destination ".\artifacts\"
          Compress-Archive -Path ".\artifacts\PoproshaykaBot-v$version-$arch.exe" -DestinationPath ".\artifacts\PoproshaykaBot-v$version-$arch.zip"
          Compress-Archive -Path ".\artifacts\PoproshaykaBot-v$version-$arch-portable.exe" -DestinationPath ".\artifacts\PoproshaykaBot-v$version-$arch-portable.zip"
          Get-ChildItem ".\artifacts\*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content ".\artifacts\SHA256SUMS-$arch.txt" -Encoding ascii
          $tfm = (Select-String -Path ".\PoproshaykaBot.Wpf.csproj" -Pattern '<TargetFramework>(.*?)</TargetFramework>').Matches[0].Groups[1].Value
          Set-Content ".\artifacts\RUNTIME-$arch.txt" -Value $tfm -Encoding ascii -NoNewline

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: PoproshaykaBot.Wpf/artifacts/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Compose release body
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"
          AUTO_NOTES=$(gh api -X POST "repos/${REPO}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            --jq '.body' || echo "")
          cat > release_body.md <<EOF
          ## 📥 Скачать

          <table>
            <thead>
              <tr>
                <th align="center">Вариант</th>
                <th align="center">x64</th>
                <th align="center">x86 <sub>(рекомендуется)</sub></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td align="center">
                  <strong>🟢 Portable</strong><br/>
                  <sub>не требует .NET</sub>
                </td>
                <td align="center">
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x64-portable.exe"><img src="https://img.shields.io/badge/⬇️_EXE-2ea043?style=for-the-badge" alt="Portable x64 EXE" /></a>
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x64-portable.zip"><img src="https://img.shields.io/badge/📦_ZIP-2ea043?style=for-the-badge" alt="Portable x64 ZIP" /></a>
                </td>
                <td align="center">
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x86-portable.exe"><img src="https://img.shields.io/badge/⬇️_EXE-2ea043?style=for-the-badge" alt="Portable x86 EXE" /></a>
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x86-portable.zip"><img src="https://img.shields.io/badge/📦_ZIP-2ea043?style=for-the-badge" alt="Portable x86 ZIP" /></a>
                </td>
              </tr>
              <tr>
                <td align="center">
                  <strong>🔵 Framework-dependent</strong><br/>
                  <sub>нужен <a href="https://dotnet.microsoft.com/download/dotnet/10.0">.NET 10 Desktop Runtime</a></sub>
                </td>
                <td align="center">
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x64.exe"><img src="https://img.shields.io/badge/⬇️_EXE-1f6feb?style=for-the-badge" alt="Framework-dependent x64 EXE" /></a>
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x64.zip"><img src="https://img.shields.io/badge/📦_ZIP-1f6feb?style=for-the-badge" alt="Framework-dependent x64 ZIP" /></a>
                </td>
                <td align="center">
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x86.exe"><img src="https://img.shields.io/badge/⬇️_EXE-1f6feb?style=for-the-badge" alt="Framework-dependent x86 EXE" /></a>
                  <a href="${BASE}/PoproshaykaBot-v${VERSION}-x86.zip"><img src="https://img.shields.io/badge/📦_ZIP-1f6feb?style=for-the-badge" alt="Framework-dependent x86 ZIP" /></a>
                </td>
              </tr>
            </tbody>
          </table>


          ---

          EOF
          printf '%s\n' "${AUTO_NOTES}" >> release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: PoproshaykaBot v${{ needs.prepare.outputs.version }}
          files: artifacts/*
          body_path: release_body.md
